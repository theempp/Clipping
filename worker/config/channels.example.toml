# Copy to config/channels.toml. Max 3 channels until CPU/GPU load is measured.
max_channels = 3

# Shared detector starting values (clip-detector-tuning owns changes; one at a time).
[detector]
threshold = 2.5
cooldown_s = 45
merge_s = 20

# caption_style: values come from references/ (D022). Below = D048 proposal from the
# dashboard "Stage" refs (pins 008, 011), locked by Zo. Poppins SemiBold must be
# installed on the PC (SIL OFL, free). Colours: #RRGGBB or ASS &HAABBGGRR.
[caption_style]
font = "Poppins SemiBold"
size = 78
primary_colour = "#FFFFFF"
highlight_colour = "#60F3BD"
outline_colour = "#000002"
outline = 6
margin_v = 420
words_per_line = 3
# D050 (Zo, 2026-11-20): active word pops to 115% and settles to 100% over 90 ms.
pop_scale = 115
pop_ms = 90

# Punch-in zooms at sentence ends (P3). scale 1.0 = off until Zo picks a strength.
# Gaming layouts zoom only the facecam panel; IRL (track) mode zooms the whole frame.
[zoom]
scale = 1.0
ramp_s = 0.2
hold_s = 1.2
min_gap_s = 4.0

# All three stream on Twitch (checked 2026-11-20: active Twitch VODs; Kick accounts idle).
# Layouts measured on 1920x1080 frames from each streamer's GTA 6 VOD (2026-11-18/19).
# Gameplay boxes avoid each overlay's chat, facecam and sub counter. Scenes without a
# facecam (IRL, full-screen cam) still need a crop fix in review.

[[channels]]
platform = "twitch"
login = "lacy"
streamer = "lacy"        # streamers.slug in Supabase; must be in an ACTIVE campaign to capture
[channels.layout]        # facecam top-left 494x278; chat top-right from x=1365
facecam = { x = 0, y = 0, w = 494, h = 278 }
gameplay = { x = 494, y = 0, w = 866, h = 1080 }
facecam_height = 640
[channels.reactions]     # per-channel emotes, merged over the defaults
# lacyW = 1.0

[[channels]]
platform = "twitch"
login = "clix"
streamer = "clix"
[channels.layout]        # facecam top-left under the health bars; timer/subs top-right
facecam = { x = 0, y = 80, w = 478, h = 269 }
gameplay = { x = 506, y = 0, w = 908, h = 1080 }
facecam_height = 640

[[channels]]
platform = "twitch"
login = "silky"
streamer = "silky"
[channels.layout]        # cut-out facecam bottom-right; chat top-right from x=1414
facecam = { x = 1450, y = 800, w = 470, h = 280 }
# Wider box keeps the full game subtitle (x 490-1424); taller facecam slot (720)
# makes the gameplay slot wide enough to show all 960 px without side trim.
gameplay = { x = 466, y = 0, w = 960, h = 1080 }
facecam_height = 720

[extra.kick_chatrooms]   # chatroom_id -> kick login (needed for the Pusher chat path)
# "123456" = "example"
