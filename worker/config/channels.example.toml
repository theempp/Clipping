# Copy to config/channels.toml. Any number of channels may be listed; at most
# max_channels are CAPTURED AT ONCE until CPU/GPU load is measured (GTA 6 streams
# first, then core before gta6_only, then most viewers). D069.
max_channels = 3

# GTA 6 recognition and boost (D069). Twitch category "Grand Theft Auto VI" = 1867279146
# (seen on live Helix data 2026-11-21). Kick has no stable id yet, so its category name
# is matched by name_pattern (default: "Grand Theft Auto VI/6", "GTA VI/6").
# boost multiplies the detector score of CORE channels while they play GTA 6
# (more moments pass the threshold and they rank higher). Tune with clip-detector-tuning.
[gta6]
category_ids = ["1867279146"]
boost = 1.25

# Shared detector starting values (clip-detector-tuning owns changes; one at a time).
[detector]
threshold = 2.5
cooldown_s = 45
merge_s = 20

# caption_style: values come from references/ (D022). Below = D048 proposal from the
# dashboard "Stage" refs (pins 008, 011), locked by Zo. Poppins SemiBold must be
# installed on the PC (SIL OFL, free). Colours: #RRGGBB or ASS &HAABBGGRR.
[caption_style]
font = "Poppins SemiBold"
size = 78
primary_colour = "#FFFFFF"
highlight_colour = "#60F3BD"
outline_colour = "#000002"
outline = 6
margin_v = 420
words_per_line = 3
# D050 (Zo, 2026-11-20): active word pops to 115% and settles to 100% over 90 ms.
pop_scale = 115
pop_ms = 90

# Punch-in zooms (P3). D077 (Zo, 2026-11-22) replaces D051's 130% at every sentence end, which read as
# robotic: gentle 112%, cosine-eased in and out, only on the detector peak and shouted lines, at most 2
# per clip, plus a slow 3% push across the whole clip so the frame is never dead still.
# Gaming layouts zoom only the facecam panel; IRL (track) mode zooms the whole frame.
# D112 (Zo, 2026-11-23): NO zooms on any clip, existing or future. scale 1.0 = off, no drift.
[zoom]
scale = 1.0
ramp_s = 0.6
hold_s = 1.8
min_gap_s = 8.0
max_zooms = 2
moments = "emphasis"
ease = "smooth"
drift = 0.0

# Whoosh on each zoom (P4). D052 (Zo, 2026-11-20): off by default. Synthesized locally, no licence risk. A campaign with
# rules.allow_sfx = false always renders without it; a revision note can switch it per clip.
[sfx]
enabled = false
volume_db = -18.0

# Clipper wiring flags (D089, docs/clipper-review/wiring-plan.md). All off by default; flip one at a
# time after its replay/dry-run check. Nothing here can publish: the review gate (D042) is unchanged.
[features]
score_100 = false      # 0-100 score = 50 measured + 50 judged; score_10 = round(score/10); drop < 60
dead_air_gate = false  # show_start + quiet x0.3 in the detector; black/frozen frame rejects on the shortlist
brain = false          # per-streamer weights from streamers/<slug>/brain.json
viewer_clips = false   # Helix Get Clips poller: viewers_clipped badge + positive label
clip_that = false      # CLIP THAT: last 40 s from the buffer as a labelled job
dry_run = false        # pipeline stops before Supabase upload; report written to renders/<job>/
links = false          # paste-a-link: run dashboard link jobs inside `clipworker live` (or run `clipworker links`)

# Dead-air gate numbers (replay-test before enabling; clip-detector-tuning owns changes).
[dead_air]
quiet_mult = 0.3
show_start_active_s = 8

