name: dashboard
on:
  pull_request:
    paths: ["dashboard/**"]
  push:
    branches: [main]
    paths: ["dashboard/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env: { NEXT_PUBLIC_CLIPP_DEMO: "1", NEXT_TELEMETRY_DISABLED: "1" }
