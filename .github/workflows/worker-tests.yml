name: worker-tests
on:
  pull_request:
    paths: ["worker/**", "supabase/**"]
  push:
    branches: [main]
    paths: ["worker/**", "supabase/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core postgresql
      - run: pip install -e "worker[dev]"
      - run: cd worker && pytest -q
